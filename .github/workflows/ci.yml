name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded pull-request run is cancelled when a new push replaces it, so a
# hung run cannot keep holding a runner. Pushes to main get a unique group per
# commit and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The job only reads the tree; don't leave the token in the checkout.
          persist-credentials: false
      - run: python3 -V
      - run: python3 -m pip install "pytest>=8,<9"
      - run: python3 -m pytest -q
